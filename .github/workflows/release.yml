name: Build Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y

      - name: Build Windows release packages
        shell: pwsh
        run: ./scripts/publish-win.ps1 -Installer

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Portalkeeper-Windows
          path: |
            dist/Portalkeeper-*-win-x64.zip
            dist/Portalkeeper-Setup-*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip \
            libstorm9 \
            zlib1g \
            libbz2-1.0 \
            libtomcrypt1 \
            libtommath1 \
            libgmp10

      - name: Build Linux release package
        run: |
          STORMLIB_PATH="$(find /usr/lib -type f -name 'libstorm.so*' 2>/dev/null | head -n 1)"

          if [ -z "$STORMLIB_PATH" ]; then
            echo "ERROR: Could not locate installed StormLib."
            dpkg -L libstorm9 || true
            exit 1
          fi

          echo "Using StormLib: $STORMLIB_PATH"
          STORMLIB_PATH="$STORMLIB_PATH" bash ./scripts/publish-linux.sh

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Portalkeeper-Linux
          path: dist/Portalkeeper-*-linux-x64.zip
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-linux

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: Portalkeeper-Windows
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: Portalkeeper-Linux
          path: release-assets

      - name: Show release files
        run: ls -lh release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          gh release create "$TAG" \
            release-assets/Portalkeeper-*-win-x64.zip \
            release-assets/Portalkeeper-Setup-*.exe \
            release-assets/Portalkeeper-*-linux-x64.zip \
            --title "Portalkeeper $TAG" \
            --generate-notes \
            --verify-tag

      # Tells the realm's portal about the release, so open launchers update within about a minute
      # instead of waiting for the portal's hourly look at GitHub. Needs the PORTAL_RELEASE_SECRET
      # secret (the portal's LAUNCHER_RELEASE_SECRET). A failure here never fails the release.
      - name: Announce the release to the portal
        continue-on-error: true
        env:
          PORTAL_RELEASE_SECRET: ${{ secrets.PORTAL_RELEASE_SECRET }}
          PORTAL_VERSION_URL: ${{ vars.PORTAL_VERSION_URL || 'https://wow.vaultrona.com/api/launcher/version.php' }}
        run: |
          if [ -z "$PORTAL_RELEASE_SECRET" ]; then
            echo "PORTAL_RELEASE_SECRET isn't set. The portal finds the release by itself."
            exit 0
          fi

          BODY=$(printf '{"tag":"%s","time":%s}' "$GITHUB_REF_NAME" "$(date +%s)")
          SIGNATURE=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$PORTAL_RELEASE_SECRET" | awk '{print $NF}')

          curl --fail-with-body --silent --show-error --max-time 30 --retry 3 --retry-all-errors \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Signature: sha256=$SIGNATURE" \
            --data-binary "$BODY" \
            "$PORTAL_VERSION_URL"
